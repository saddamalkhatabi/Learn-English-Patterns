name: Verify Node app and media
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: python tests/scene_zip_test.py
      - run: npm run db:sync
      - run: npm run db:sync
      - uses: actions/upload-artifact@v4
        with:
          name: verified-status
          path: docs/VERIFIED-STATUS.json
