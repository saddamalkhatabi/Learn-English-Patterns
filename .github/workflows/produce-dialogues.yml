name: Record and align conversations
on:
  push:
    branches: [main]
    paths: [public/dialogues.json, scripts/produce-dialogues.py, .github/workflows/produce-dialogues.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dialogue-production
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {ref: media-tools, path: .media-tools}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: audio
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), crypto=require('node:crypto');
          const assets=require('./public/dialogue-audio.json');
          const needed=require('./public/dialogues.json').dialogues.some(d=>{
            const r=assets[d.id];
            const title=d.en.trim().replace(/[.!?]+$/,'')+'.';
            if(!r||r.title!==title||!r.intro||JSON.stringify(r.signature)!==JSON.stringify(d.lines.map(l=>[l.en,l.voice])))return true;
            return !fs.existsSync('public/'+r.path)||crypto.createHash('sha256').update(fs.readFileSync('public/'+r.path)).digest('hex')!==r.sha256;
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'needed='+needed+'\n');
          NODE
      - uses: actions/cache@v4
        if: steps.audio.outputs.needed == 'true'
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: patterns-kokoro094-ctc-v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
        if: steps.audio.outputs.needed == 'true'
      - run: pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
        if: steps.audio.outputs.needed == 'true'
      - run: pip install -r .media-tools/scripts/audio-requirements.txt
        if: steps.audio.outputs.needed == 'true'
      - run: python scripts/produce-dialogues.py
        if: steps.audio.outputs.needed == 'true'
      - name: Publish measured recordings and refresh offline indexes
        if: steps.audio.outputs.needed == 'true'
        run: |
          git config user.name 'English Patterns media'
          git config user.email 'noreply@users.noreply.github.com'
          git add public/dialogue-audio.json public/assets/audio
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish measured conversation audio'
          git fetch origin main
          git rebase origin/main
          npm run build
          DIALOGUE_AUDIO_REQUIRED=1 npm test
          git add public/app-version.js public/app-version.json public/offline-manifest.json
          if ! git diff --cached --quiet; then git commit -m 'Refresh offline conversation media'; fi
          git push origin HEAD:main
