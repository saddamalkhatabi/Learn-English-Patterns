name: Record and align conversations
on:
  push:
    branches: [main, codex/conversation-practice]
    paths: [public/dialogues.json, public/comparisons.json, public/idea-scenes.json, public/teaching-index.json, public/training-narration.js, public/curriculum.json, public/pilot.json, public/expansion-media.json, scripts/training-cues.cjs, scripts/produce-dialogues.py, scripts/merge-dialogue-audio.cjs, .github/workflows/produce-dialogues.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dialogue-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.audio.outputs.needed }}
      shards: ${{ steps.audio.outputs.shards }}
      count: ${{ steps.audio.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - id: audio
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), crypto=require('node:crypto');
          const assets=require('./public/dialogue-audio.json');
          const pending=require('./public/dialogues.json').dialogues.filter(d=>{
            const r=assets[d.id];
            const title=d.en.trim().replace(/[.!?]+$/,'')+'.';
            if(!r||r.title!==title||!r.intro||JSON.stringify(r.signature)!==JSON.stringify(d.lines.map(l=>[l.en,l.voice])))return true;
            return !fs.existsSync('public/'+r.path)||crypto.createHash('sha256').update(fs.readFileSync('public/'+r.path)).digest('hex')!==r.sha256;
          });
          const cues=require('./public/training-audio.json');
          const pendingCues=Object.entries(require('./scripts/training-cues.cjs')).filter(([id,spoken])=>{
            const r=cues[id];
            return !r||r.text!==spoken||!fs.existsSync('public/'+r.path)||crypto.createHash('sha256').update(fs.readFileSync('public/'+r.path)).digest('hex')!==r.sha256;
          });
          const total=pending.length+pendingCues.length;
          const count=Math.max(1,Math.min(24,Math.ceil(total/35)));
          const shards=Array.from({length:count},(_,i)=>i);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`needed=${total>0}\ncount=${count}\nshards=${JSON.stringify(shards)}\n`);
          NODE
  record:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: media-tools, path: .media-tools}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: patterns-kokoro094-ctc-v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r .media-tools/scripts/audio-requirements.txt
      - run: python scripts/produce-dialogues.py --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT" --output-dir dialogue-shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.plan.outputs.count }}
      - uses: actions/upload-artifact@v4
        with:
          name: dialogue-audio-${{ matrix.shard }}
          path: dialogue-shard/
          if-no-files-found: error
          retention-days: 2
  publish:
    needs: [plan, record]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.ref_name }}', fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          pattern: dialogue-audio-*
          path: dialogue-shards/
      - name: Publish measured recordings and refresh offline indexes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          node scripts/merge-dialogue-audio.cjs dialogue-shards
          npm run build
          DIALOGUE_AUDIO_REQUIRED=1 npm test
          git config user.name 'English Patterns media'
          git config user.email 'noreply@users.noreply.github.com'
          git add public/dialogue-audio.json public/training-audio.json public/assets/audio public/app-version.js public/app-version.json public/offline-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish measured conversation audio and offline indexes'
          git push origin "HEAD:$TARGET_BRANCH"
